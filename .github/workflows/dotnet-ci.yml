
name: OrderManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test ASP.NET Core API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OrderManagement.slnx

      - name: Build
        run: dotnet build OrderManagement.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/OrderManagement.Tests/OrderManagement.Tests.csproj --configuration Release --no-build --verbosity normal
