
name: OrderManagement CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ASP.NET Core API
    runs-on: ubuntu-latest

    steps:
      # 1. 获取 GitHub 仓库代码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. 安装 .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 3. 恢复 NuGet 依赖
      - name: Restore dependencies
        run: dotnet restore src/OrderManagement.Api/OrderManagement.Api.csproj

      # 4. 编译项目
      - name: Build
        run: dotnet build src/OrderManagement.Api/OrderManagement.Api.csproj --configuration Release --no-restore
